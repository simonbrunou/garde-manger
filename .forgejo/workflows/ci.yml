name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Unit tests
        # e2e specs (tests/e2e) run under Playwright via `bun run test:e2e`, not Bun.
        # The run gets an empty TMPDIR and fails when a test leaves a file there (#83).
        run: sh scripts/bun-test-clean-tmpdir.sh ./src ./scripts

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # The Playwright runner + node:sqlite fixtures need Node; the app server still
      # runs under Bun via the webServer command in playwright.config.ts.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run e2e tests
        # Invoke the runner under Node (node:sqlite) — not `bun run test:e2e`.
        run: npx playwright test
